<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scriptorium: Tour Guide Duel</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: white;
}

/* TOP BAR */
#topbar {
  display: flex;
  justify-content: space-between;
  padding: 12px 20px;
  background: #111a22;
  border-bottom: 1px solid #333;
}

/* HERO IMAGE */
#hero {
  position: relative;
}

#hero img {
  width: 100%;
  display: block;
}

/* OVERLAY */
#overlay {
  position: absolute;
  bottom: 20px;
  left: 20px;
  display: flex;
  gap: 20px;
}

.card {
  background: rgba(0,0,0,0.75);
  padding: 15px;
  border-radius: 10px;
  width: 320px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.primary { background: #3ba55d; }
.secondary { background: #2d6cdf; }
.warning { background: #aa3333; }

/* QUESTION PANEL */
#questionBox {
  display: none;
  padding: 20px;
  background: #111;
}

/* COMMENTARY */
#commentaryBox {
  display: none;
  padding: 20px;
}

textarea {
  width: 100%;
  height: 140px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div id="topbar">
  <div>📍 Edinburgh Tour — Leith Start</div>
  <div>Letters: <span id="letters">3000</span></div>
  <div>Stops: <span id="stops">0</span></div>
  <div>Score: <span id="score">0</span></div>
</div>

<!-- HERO -->
<div id="hero">
  <img id="scene" src="Leith-start.png">

  <div id="overlay">

    <div class="card" id="mainCard">
      <h3>Leaving Leith Cruise Terminal</h3>
      <p>
        Your passengers have just boarded. The tour begins.
      </p>

      <button class="primary" onclick="continueDriving()">Continue Driving</button>
    </div>

    <div class="card">
      <h4>How It Works</h4>
      <p>
        • Passengers ask questions<br>
        • You decide when to answer<br>
        • Spend letters to earn points
      </p>
    </div>

  </div>
</div>

<!-- QUESTION -->
<div id="questionBox">
  <h2 id="questionText"></h2>

  <button onclick="ignoreQuestion()">Ignore</button>
  <button onclick="briefAnswer()">Brief Answer (max 120 letters)</button>
  <button class="primary" onclick="fullAnswer()">Full Explanation</button>
</div>

<!-- COMMENTARY -->
<div id="commentaryBox">
  <h3>Write Your Answer</h3>
  <textarea id="commentary"></textarea>
  <br>
  <button onclick="submitAnswer()">Submit</button>
</div>

<script>

// STATE
let letters = 3000;
let stops = 0;
let score = 0;

let currentQuestion = null;
let mode = null;

// CONTINUE DRIVING
function continueDriving() {

  document.getElementById("scene").src = "Royal-yacht.png";

  document.getElementById("mainCard").innerHTML = `
    <h3>Passing the Waterfront</h3>
    <p>The passengers notice something ahead...</p>
    <button onclick="triggerBritannia()">Continue</button>
  `;
}

// TRIGGER QUESTION
function triggerBritannia() {

  currentQuestion = "britannia";

  document.getElementById("questionBox").style.display = "block";
  document.getElementById("questionText").innerText =
    "Passenger: What is the name of that ship?";
}

// OPTIONS
function ignoreQuestion() {
  closeQuestion();
}

function briefAnswer() {
  mode = "brief";
  openCommentary(120);
}

function fullAnswer() {
  mode = "full";
  openCommentary(1000);
}

// OPEN COMMENTARY
function openCommentary(limit) {
  document.getElementById("commentaryBox").style.display = "block";
  document.getElementById("commentary").setAttribute("maxlength", limit);
}

// SUBMIT
function submitAnswer() {

  let text = document.getElementById("commentary").value;
  let length = text.length;

  if(length === 0) {
    alert("Write something.");
    return;
  }

  if(length > letters) {
    alert("Not enough letters.");
    return;
  }

  letters -= length;

  let gained = scoreBritannia(text);
  score += gained;

  alert("You scored " + gained + " points.");

  // RESET
  document.getElementById("commentary").value = "";
  document.getElementById("commentaryBox").style.display = "none";

  closeQuestion();
  updateUI();
}

// SCORING
function scoreBritannia(text) {

  let t = text.toLowerCase();
  let points = 0;

  if(mode === "brief") points += 2;
  if(mode === "full") points += 4;

  if(t.includes("britannia")) points += 4;
  if(t.includes("royal yacht")) points += 3;
  if(t.includes("queen") || t.includes("royal family")) points += 2;
  if(t.includes("museum") || t.includes("decommissioned")) points += 2;

  if(points === 0) points = -2; // wrong answer penalty

  return points;
}

// CLOSE
function closeQuestion() {
  document.getElementById("questionBox").style.display = "none";
}

// UI UPDATE
function updateUI() {
  document.getElementById("letters").innerText = letters;
  document.getElementById("score").innerText = score;
}

</script>

</body>
</html>
