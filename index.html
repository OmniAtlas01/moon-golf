<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scriptorium: Tour Guide Duel</title>

<style>
body { margin:0; font-family:Arial; background:#0b0f14; color:white; }

#topbar {
  display:flex; justify-content:space-between;
  padding:12px 20px; background:#111a22;
}

#hero img { width:100%; }

#overlay {
  position:absolute; bottom:20px; left:20px;
}

.card {
  background:rgba(0,0,0,0.75);
  padding:15px; border-radius:10px;
  width:340px;
}

button {
  width:100%; padding:10px;
  margin-top:8px; border:none;
  border-radius:5px; cursor:pointer;
}

.primary { background:#3ba55d; }
.secondary { background:#2d6cdf; }

#questionBox, #commentaryBox {
  display:none; padding:20px;
}

textarea { width:100%; height:160px; }
</style>
</head>

<body>

<div id="topbar">
  <div>📍 Edinburgh Tour — Leith</div>
  <div>Letters: <span id="letters">3000</span></div>
  <div>Score: <span id="score">0</span></div>
</div>

<div id="hero">
  <img id="scene" src="Leith-start.png">

  <div id="overlay">
    <div class="card" id="mainCard">
      <h3>Leaving Leith Cruise Terminal</h3>
      <button onclick="driveToShip()">Start Tour</button>
    </div>
  </div>
</div>

<div id="questionBox">
  <h2 id="questionText"></h2>
  <button onclick="ignore()">Ignore</button>
  <button onclick="brief()">Brief Answer</button>
  <button class="primary" onclick="full()">Full Answer</button>
</div>

<div id="commentaryBox">
  <textarea id="commentary"></textarea>
  <button onclick="submit()">Submit</button>
</div>

<script>

// STATE
let letters = 3000;
let score = 0;
let mode = "";
let currentType = "";

let keywords = {
  monarch:false,
  beach:false,
  leith:false,
  edinburgh:false,
  docks:false,
  boat:false,
  fishing:false,
  banana:false
};

// --- FLOW ---

function driveToShip() {
  scene("Royal-yacht.png","Passing the Waterfront","Continue",askShip);
}

function askShip() {
  showQuestion("What is the name of that ship?","ship");
}

function goToRedLight() {
  scene("Ocean-terminal-carpark.png","Stopped at Red Lights","Wait",followUp);
}

function followUp() {
  if(!keywords.monarch) {
    showQuestion("Which Monarchs made landings here?","monarch");
  }
  else if(!keywords.beach) {
    showQuestion("Does Leith have a beach?","beach");
  }
  else {
    goToCommercial();
  }
}

// --- COMMERCIAL QUAY SCENE ---

function goToCommercial() {
  document.getElementById("scene").src = "Commercial-quay.png";

  document.getElementById("mainCard").innerHTML = `
    <h3>Near Leith Docks</h3>
    <p>This is a good place to stop and talk about the docks.</p>
    
    <button onclick="askRoad()">Passenger Question</button>
    <button onclick="lecture()">Pull Over & Lecture</button>
    <button onclick="goCitadel()">Continue Driving</button>
  `;
}

// --- CITADEL COURT SCENE ---

function goCitadel() {
  document.getElementById("scene").src = "Citadel-court.png";

  document.getElementById("mainCard").innerHTML = `
    <h3>Passing Citadel Court</h3>
    <p>High-rise flats and working streets define this part of Leith.</p>

    <button onclick="askHistory()">Passenger Question</button>
    <button onclick="lecture()">Pull Over & Lecture</button>
    <button onclick="goLeithMural()">Continue Driving</button>
  `;
}

// --- LEITH MURAL SCENE ---

function goLeithMural() {
  document.getElementById("scene").src = "Leith-mural.png";

  document.getElementById("mainCard").innerHTML = `
    <h3>Leith History Mural</h3>
    <p>You pass the famous Leith mural at Tolbooth Wynd. You could stop and explain its history.</p>

    <button onclick="askMural()">Passenger Question</button>
    <button onclick="lecture()">Stop & Lecture</button>
    <button onclick="goBoatFishing()">Keep Driving</button>
  `;
}

// --- BOAT & FISHING TOUR SCENE ---

function goBoatFishing() {
  document.getElementById("scene").src = "Boat-fishing.png";

  document.getElementById("mainCard").innerHTML = `
    <h3>Water of Leith Boat & Fishing Tour</h3>
    <p>A passenger notices the sign on the bridge and asks about the activity.</p>

    <button onclick="askBoatFishingPrice()">Passenger Question</button>
    <button onclick="goBikeOffer()">Keep Driving</button>
  `;
}

// --- BIKE TOUR OFFER SCENE ---

function goBikeOffer() {
  document.getElementById("scene").src = "Omniatlas-bikes.png";

  document.getElementById("mainCard").innerHTML = `
    <h3>Electric Bike Tour Opportunity</h3>
    <p>A passenger notices the OmniAtlas bike tour sign.</p>

    <button onclick="askBikePrice()">Passenger Question</button>
    <button onclick="goBikeJunction()">Continue to Junction</button>
  `;
}

// --- JUNCTION ---

function goBikeJunction() {
  document.getElementById("scene").src = "Ferryroad-junction.png";

  let suggestion = "";

  if(keywords.boat || keywords.fishing || keywords.banana) {
    suggestion = `
      <p><strong>Passenger:</strong> Are we still able to book that Water of Leith Boat & Fishing Tour?</p>
      <button class="primary" onclick="choose('boatfishing')">Book Boat & Fishing Tour</button>
    `;
  }

  document.getElementById("mainCard").innerHTML = `
    <h3>Choose Your Direction</h3>
    <p>The passengers are waiting to see which way you go.</p>

    ${suggestion}

    <button onclick="choose('bike')">⬅ OmniAtlas Abandoned Railway Electric Bike Tours</button>
    <button onclick="choose('edinburgh')">⬆ Edinburgh City Centre via Leith</button>
    <button onclick="choose('newtown')">➡ Edinburgh City Centre via Newtown</button>
  `;
}

// --- PASSENGER QUESTIONS ---

function askRoad() {
  showQuestion("What's the name of that road with the green bar?", "road");
}

function askHistory() {
  showQuestion("Leith must have been heavily bombed during the wars due to its industry?", "history");
}

function askEconomy() {
  showQuestion("What is the main resource that Leith's economy was built on?", "economy");
}

function askMural() {
  showQuestion("What is the Leith History Mural about?", "mural");
}

function askBoatFishingPrice() {
  showQuestion("What is the price of the boat and fishing tour?", "boatfishing");
}

function askBikePrice() {
  showQuestion("How much extra is it to go on the bike tour?", "bikeprice");
}

// --- LECTURE MODE ---

function lecture() {
  currentType = "lecture";
  document.getElementById("commentaryBox").style.display = "block";
}

// --- CHOICES ---

function choose(route) {
  if(route === "boatfishing") {
    alert("Boat & Fishing Tour booked. Strong affiliate opportunity secured.");
    score += 8;
    updateUI();
  }

  if(route === "bike") {
    alert("OmniAtlas bike tour route chosen. Abandoned railway route coming next build.");
  }

  if(route === "edinburgh") {
    alert("City Centre via Leith chosen. Historic urban route coming next build.");
  }

  if(route === "newtown") {
    alert("City Centre via Newtown chosen. Elegant city route coming next build.");
  }
}

// --- QUESTION SYSTEM ---

function showQuestion(text,type) {
  currentType = type;
  document.getElementById("questionBox").style.display = "block";
  document.getElementById("questionText").innerText = text;
}

function ignore() {
  closeQ();
  continueAfterQuestion();
}

function brief() {
  mode="brief";
  openBox(120);
}

function full() {
  mode="full";
  openBox(1000);
}

function openBox(limit) {
  document.getElementById("commentaryBox").style.display="block";
  document.getElementById("commentary").maxLength=limit;
}

// --- SUBMIT ---

function submit() {

  let text = document.getElementById("commentary").value.toLowerCase();
  let len = text.length;

  if(len === 0) return;

  letters -= len;
  let gained = 0;

  if(currentType==="ship") {
    if(text.includes("britannia")) gained+=5;
    if(text.includes("royal")) {
      gained+=3;
      keywords.monarch=true;
    }
  }

  if(currentType==="monarch") {
    if(text.includes("queen") || text.includes("royal")) {
      gained+=6;
      keywords.monarch=true;
    }
  }

  if(currentType==="beach") {
    if(text.includes("leith sands") || text.includes("beach")) {
      gained+=6;
      keywords.leith=true;
      keywords.beach=true;
    }
  }

  if(currentType==="road") {
    if(text.includes("commercial quay")) {
      gained+=5;
      keywords.leith=true;
    }
  }

  if(currentType==="history") {
    if(text.includes("bomb") || text.includes("war") || text.includes("target")) {
      gained += 4;
    }

    if(text.includes("north fort street") || text.includes("fort house")) {
      gained += 6;
      keywords.leith = true;
    }
  }

  if(currentType==="economy") {
    if(text.includes("port of leith")) {
      gained += 6;
      keywords.leith = true;
    }

    if(text.includes("docks") || text.includes("trade") || text.includes("ships")) {
      gained += 4;
      keywords.docks = true;
    }
  }

  if(currentType==="mural") {
    if(text.includes("leith history mural")) gained += 6;
    if(text.includes("tim chalk") || text.includes("paul grime")) gained += 6;
    if(text.includes("dock") || text.includes("shipyard") || text.includes("henry robb")) gained += 5;
    if(text.includes("working") || text.includes("community") || text.includes("industrial")) gained += 4;
    if(text.includes("tolbooth wynd")) gained += 4;

    keywords.leith = true;
  }

  if(currentType==="boatfishing") {
    if(text.includes("25") || text.includes("30") || text.includes("35")) gained += 4;
    if(text.includes("boat")) {
      gained += 3;
      keywords.boat = true;
    }
    if(text.includes("fish") || text.includes("fishing")) {
      gained += 4;
      keywords.fishing = true;
    }
    if(text.includes("water of leith")) gained += 4;
    if(text.includes("gear") || text.includes("rod") || text.includes("equipment")) gained += 4;
    if(text.includes("banana flats") || text.includes("banana")) {
      gained += 5;
      keywords.banana = true;
    }
    if(text.includes("deal") || text.includes("discount") || text.includes("affiliate")) gained += 4;

    if(text.includes("expensive") || text.includes("not sure") || text.includes("maybe")) gained -= 3;

    keywords.boat = true;
    keywords.fishing = true;
  }

  if(currentType==="bikeprice") {
    if(text.includes("10") || text.includes("15")) {
      gained += 6;
    }
    else if(text.includes("20") || text.includes("25")) {
      gained += 4;
    }
    else if(text.includes("5") || text.includes("cheap")) {
      gained += 2;
    }
    else if(text.includes("30") || text.includes("40")) {
      gained -= 3;
    }
  }

  if(currentType==="lecture") {
    if(text.includes("ss explorer")) gained+=6;
    if(text.includes("forth lock")) gained+=5;
    if(text.includes("breakwater")) gained+=7;
    if(text.includes("tally toor")) gained+=8;
    if(text.includes("signal tower")) gained+=6;
    if(text.includes("victoria quay")) gained+=5;
    if(text.includes("fingal")) gained+=5;
    if(text.includes("oyster")) gained+=8;

    if(text.includes("leith mural")) gained+=6;
    if(text.includes("tim chalk") || text.includes("paul grime")) gained+=5;
    if(text.includes("henry robb")) gained+=5;

    keywords.docks = true;
    keywords.leith = true;
  }

  if(text.includes("edinburgh")) keywords.edinburgh = true;

  if(gained === 0) gained = -2;

  score += gained;

  alert("Score: " + gained);

  reset();
  updateUI();
}

// --- HELPERS ---

function reset() {
  document.getElementById("commentary").value="";
  document.getElementById("commentaryBox").style.display="none";
  closeQ();

  continueAfterQuestion();
}

function continueAfterQuestion() {
  if(currentType==="ship") {
    goToRedLight();
  }
  else if(currentType==="monarch" || currentType==="beach") {
    followUp();
  }
  else if(currentType==="road") {
    goCitadel();
  }
  else if(currentType==="history" || currentType==="economy") {
    goLeithMural();
  }
  else if(currentType==="mural" || currentType==="lecture") {
    goBoatFishing();
  }
  else if(currentType==="boatfishing") {
    goBikeOffer();
  }
  else if(currentType==="bikeprice") {
    goBikeJunction();
  }
  else {
    goBikeOffer();
  }
}

function closeQ() {
  document.getElementById("questionBox").style.display="none";
}

function scene(img,title,btn,fn) {
  document.getElementById("scene").src = img;
  document.getElementById("mainCard").innerHTML = `
    <h3>${title}</h3>
    <button onclick="${fn.name}()">${btn}</button>
  `;
}

function updateUI() {
  document.getElementById("letters").innerText=letters;
  document.getElementById("score").innerText=score;
}

</script>

</body>
</html>
