<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scriptorium: Tour Guide Duel</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: white;
}

#topbar {
  display: flex;
  justify-content: space-between;
  padding: 12px 20px;
  background: #111a22;
}

#hero img {
  width: 100%;
}

#overlay {
  position: absolute;
  bottom: 20px;
  left: 20px;
  display: flex;
  gap: 20px;
}

.card {
  background: rgba(0,0,0,0.75);
  padding: 15px;
  border-radius: 10px;
  width: 320px;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.primary { background: #3ba55d; }
.secondary { background: #2d6cdf; }

#questionBox, #commentaryBox {
  display: none;
  padding: 20px;
}

textarea {
  width: 100%;
  height: 140px;
}
</style>
</head>

<body>

<div id="topbar">
  <div>📍 Edinburgh Tour — Leith</div>
  <div>Letters: <span id="letters">3000</span></div>
  <div>Score: <span id="score">0</span></div>
</div>

<div id="hero">
  <img id="scene" src="Leith-start.png">

  <div id="overlay">
    <div class="card" id="mainCard">
      <h3>Leaving Leith Cruise Terminal</h3>
      <button onclick="driveToShip()">Continue Driving</button>
    </div>
  </div>
</div>

<div id="questionBox">
  <h2 id="questionText"></h2>

  <button onclick="ignore()">Ignore</button>
  <button onclick="brief()">Brief Answer</button>
  <button class="primary" onclick="full()">Full Answer</button>
</div>

<div id="commentaryBox">
  <textarea id="commentary"></textarea>
  <button onclick="submit()">Submit</button>
</div>

<script>

// STATE
let letters = 3000;
let score = 0;
let mode = "";
let keywordsCovered = {};

// --- STEP 1: DRIVE TO SHIP ---
function driveToShip() {
  document.getElementById("scene").src = "Royal-yacht.png";

  document.getElementById("mainCard").innerHTML = `
    <h3>Passing the Waterfront</h3>
    <button onclick="askShip()">Continue</button>
  `;
}

// --- PRIMARY QUESTION ---
function askShip() {
  showQuestion("What is the name of that ship?", "ship");
}

// --- RED LIGHT SCENE ---
function goToRedLight() {
  document.getElementById("scene").src = "Ocean-terminal-carpark.png";

  document.getElementById("mainCard").innerHTML = `
    <h3>Stopped at Red Lights</h3>
    <button onclick="triggerFollowUp()">Wait</button>
  `;
}

// --- FOLLOW-UP LOGIC ---
function triggerFollowUp() {

  // If player did NOT mention monarchy
  if(!keywordsCovered.monarch) {
    showQuestion("Which Monarchs made landings here?", "monarch");
  }

  // If they DID cover monarchy but not beach
  else if(!keywordsCovered.beach) {
    showQuestion("Does Leith have a beach?", "beach");
  }

  else {
    document.getElementById("mainCard").innerHTML = `
      <h3>Passengers are satisfied.</h3>
      <button onclick="continueJourney()">Continue Driving</button>
    `;
  }
}

// --- SHOW QUESTION ---
function showQuestion(text, type) {
  currentType = type;
  document.getElementById("questionBox").style.display = "block";
  document.getElementById("questionText").innerText = text;
}

// --- OPTIONS ---
function ignore() {
  closeQ();
  goToRedLight();
}

function brief() {
  mode = "brief";
  openBox(120);
}

function full() {
  mode = "full";
  openBox(1000);
}

// --- COMMENTARY ---
function openBox(limit) {
  document.getElementById("commentaryBox").style.display = "block";
  document.getElementById("commentary").maxLength = limit;
}

// --- SUBMIT ---
function submit() {

  let text = document.getElementById("commentary").value.toLowerCase();
  let len = text.length;

  if(len === 0) return;

  letters -= len;

  let gained = 0;

  // SHIP LOGIC
  if(currentType === "ship") {
    if(text.includes("britannia")) {
      gained += 5;
      keywordsCovered.ship = true;
    }
    if(text.includes("queen") || text.includes("royal")) {
      gained += 3;
      keywordsCovered.monarch = true;
    }
  }

  // MONARCH FOLLOW-UP
  if(currentType === "monarch") {
    if(text.includes("queen") || text.includes("royal")) {
      gained += 6;
      keywordsCovered.monarch = true;
    }
  }

  // BEACH QUESTION
  if(currentType === "beach") {
    if(text.includes("leith sands") || text.includes("beach")) {
      gained += 6;
      keywordsCovered.beach = true;
    }
  }

  if(gained === 0) gained = -2;

  score += gained;

  alert("Score: " + gained);

  document.getElementById("commentary").value = "";
  document.getElementById("commentaryBox").style.display = "none";

  closeQ();
  goToRedLight();

  updateUI();
}

// --- CLOSE QUESTION ---
function closeQ() {
  document.getElementById("questionBox").style.display = "none";
}

// --- CONTINUE ---
function continueJourney() {
  alert("Next section coming next version...");
}

// --- UI ---
function updateUI() {
  document.getElementById("letters").innerText = letters;
  document.getElementById("score").innerText = score;
}

</script>

</body>
</html>
