<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scriptorium: Tour Guide Duel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

.game {
  max-width: 1200px;
  margin: auto;
  padding: 14px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  background: #111827;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 12px;
  font-weight: bold;
}

.scene img {
  width: 100%;
  border-radius: 12px;
  border: 3px solid #334155;
}

.panel {
  background: #111827;
  padding: 16px;
  margin-top: 12px;
  border-radius: 12px;
  border: 1px solid #334155;
}

.routes {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.route {
  flex: 1;
  background: #1f2937;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #334155;
}

button {
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  opacity: 0.9;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="game">

<h1>Scriptorium: Tour Guide Duel</h1>

<div class="topbar">
  <div id="location">📍 Leith Junction</div>
  <div>✍ Letters Left: <span id="letters">2500</span></div>
  <div>🏁 Stops: 1/8</div>
  <div>⭐ Score: 18</div>
</div>

<div class="scene">
  <img id="sceneImage" src="Leith-jobcentre.png">
</div>

<div class="panel" id="panel"></div>

</div>

<script>

let currentScene = 2;

loadScene(currentScene);

function loadScene(scene) {
  const panel = document.getElementById("panel");
  const image = document.getElementById("sceneImage");
  const location = document.getElementById("location");

  if (scene === 2) {
    location.innerText = "📍 Leith Jobcentre Junction";
    image.src = "Leith-jobcentre.png";

    panel.innerHTML = `
      <h2>🧭 Route Decision</h2>
      <p>You reach a busy junction in Leith.</p>

      <div class="routes">

        <div class="route">
          <h3>⬅ Port of Leith</h3>
          <p>Maritime docks and harbour life.</p>
          <button onclick="nextScene(99)">Go</button>
        </div>

        <div class="route">
          <h3>⬆ Foot of the Walk</h3>
          <p>Main route into Leith life.</p>
          <button onclick="nextScene(3)">Go</button>
        </div>

        <div class="route">
          <h3>➡ Botanic Route</h3>
          <p>Quieter inland route.</p>
          <button onclick="nextScene(99)">Go</button>
        </div>

      </div>
    `;
  }

  if (scene === 3) {
    location.innerText = "📍 Ferry Road Junction";
    image.src = "Ferryroad-junction.png";

    panel.innerHTML = `
      <h2>🧭 Route Decision</h2>
      <p>You continue toward the Foot of the Walk.</p>

      <div class="routes">

        <div class="route">
          <h3>⬆ Continue — Foot of the Walk</h3>
          <p>Stay on the main route.</p>
          <button onclick="nextScene(4)">Go</button>
        </div>

        <div class="route">
          <h3>➡ Inverleith / Botanic Route</h3>
          <p>Turn toward greener areas.</p>
          <button onclick="nextScene(99)">Go</button>
        </div>

      </div>
    `;
  }

  if (scene === 4) {
    location.innerText = "📍 Great Junction Street";
    image.src = "scene-5.png";

    panel.innerHTML = `
      <h2>🧭 Route Decision</h2>
      <p>The route opens toward central Edinburgh.</p>

      <div class="routes">

        <div class="route">
          <h3>⬆ Foot of the Walk</h3>
          <p>Local Leith route.</p>
          <button onclick="nextScene(5)">Go</button>
        </div>

        <div class="route">
          <h3>➡ New Town</h3>
          <p>Elegant Georgian Edinburgh.</p>
          <button onclick="nextScene(99)">Go</button>
        </div>

      </div>
    `;
  }

  if (scene === 5) {
    location.innerText = "📍 Foot of the Walk";
    panel.innerHTML = `
      <h2>Route Progressed</h2>
      <p>You have successfully followed the main Leith route.</p>
      <p>Next step: we add another stop or decision.</p>
    `;
  }

}

function nextScene(scene) {
  if (scene === 99) {
    alert("This route will be built next.");
    return;
  }

  currentScene = scene;
  loadScene(scene);
}

</script>

</body>
</html>
